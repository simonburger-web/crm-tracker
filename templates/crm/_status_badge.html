<span {% if badge_pk %}id="badge-{{ badge_pk }}" {% endif %}class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if status == 'customer' %}bg-green-100 text-green-800
  {% elif status == 'prospect' %}bg-blue-100 text-blue-800
  {% elif status == 'prospect_1_week' %}bg-violet-100 text-violet-800
  {% elif status == 'lead' %}bg-yellow-100 text-yellow-800
  {% elif status == 'call_back' %}bg-indigo-100 text-indigo-800
  {% elif status == 'call_back_no_answer' %}bg-orange-100 text-orange-800
  {% else %}bg-gray-100 text-gray-600{% endif %}">{{ label }}</span>
