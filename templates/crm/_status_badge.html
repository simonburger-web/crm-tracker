<span {% if badge_pk %}id="badge-{{ badge_pk }}" {% endif %}class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-sm border border-gray-200 bg-white px-1.5 py-0.5 text-xs font-medium text-gray-700"><span class="h-1.5 w-1.5 rounded-full
  {% if status == 'customer' %}bg-green-500
  {% elif status == 'prospect' %}bg-indigo-500
  {% elif status == 'prospect_1_week' %}bg-violet-500
  {% elif status == 'lead' %}bg-gray-400
  {% elif status == 'call_back' %}bg-blue-500
  {% elif status == 'call_back_no_answer' %}bg-orange-500
  {% else %}bg-gray-300{% endif %}"></span>{{ label }}</span>
