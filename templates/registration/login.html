<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — CRM Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8">
    <p class="text-xs font-semibold uppercase tracking-widest text-indigo-400 mb-2">CRM Tracker</p>
    <h1 class="text-xl font-bold text-gray-900 mb-6">Sign in</h1>
    {% if form.errors %}
    <div class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">Incorrect username or password.</div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username" required
          value="{{ form.username.value|default:'' }}"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full rounded-md bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 text-sm">Sign in</button>
    </form>
  </div>
</body>
</html>
