{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Gym{% endblock %}</title>
  <meta name="theme-color" content="#0b0c0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="{% static 'gym/icon-180.png' %}">
  <link rel="icon" type="image/png" href="{% static 'gym/icon-192.png' %}">
  <link rel="manifest" href="{% url 'gym:manifest' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c0a; --panel: #161814; --panel-2: #1f221c; --line: #2c3028;
      --text: #f1f3ec; --muted: #8d9486; --lime: #c6ff3d; --lime-ink: #10140a;
      --red: #ff6b5a; --amber: #ffc24b;
      --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: Barlow, system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.4;
      font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
      padding: 0 0 calc(24px + var(--safe-bottom));
      overscroll-behavior-y: none;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, .display { font-family: "Barlow Condensed", Barlow, sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

    .topbar {
      position: sticky; top: 0; z-index: 10; background: rgba(11,12,10,.92);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding-top: var(--safe-top);
    }
    .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
    .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 24px; letter-spacing: .06em; }
    .brand span { color: var(--lime); }
    .topbar a.ghost { color: var(--muted); font-size: 14px; font-weight: 500; padding: 10px 0 10px 10px; }

    .msg { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(198,255,61,.1); border: 1px solid rgba(198,255,61,.35); color: var(--lime); font-weight: 500; }
    .section-label { margin: 26px 0 10px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .muted { color: var(--muted); }
    .lime { color: var(--lime); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 56px; border: 0; border-radius: 14px; background: var(--lime); color: var(--lime-ink);
      font: 800 22px/1 "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    }
    .btn:active { transform: scale(.98); }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-size: 18px; min-height: 48px; }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .tag.up { background: rgba(198,255,61,.15); color: var(--lime); }
    .tag.hold { background: var(--panel-2); color: var(--muted); }
    .tag.miss { background: rgba(255,194,75,.14); color: var(--amber); }
    .tag.deload { background: rgba(255,107,90,.14); color: var(--red); }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      {% block topbar %}
      <a href="{% url 'gym:home' %}" class="brand">GYM<span>.</span></a>
      <a href="{% url 'dashboard' %}" class="ghost">CRM →</a>
      {% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block script %}{% endblock %}
</body>
</html>
