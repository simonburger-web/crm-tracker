{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}Planner{% endblock %}</title>
  <link rel="manifest" href="{% url 'planner:manifest' %}">
  <link rel="stylesheet" href="{% static 'planner/planner.css' %}">
</head>
<body data-today-url="{% url 'planner:today' %}"{% if is_today %} data-viewing-today="{{ real_today|date:'Y-m-d' }}"{% endif %}>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'planner:today' %}">Planner</a>
      <nav class="nav">
        <a href="{% url 'planner:today' %}" class="{% if request.resolver_match.url_name != 'routines' %}active{% endif %}">Day</a>
        <a href="{% url 'planner:routines' %}" class="{% if request.resolver_match.url_name == 'routines' %}active{% endif %}">Routines</a>
        <a href="{% url 'dashboard' %}">CRM →</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% if messages %}
      <div class="toasts" role="status">
        {% for m in messages %}<div class="toast {{ m.tags }}">{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
    // Opened from the home screen: always land on today, even if the icon was
    // saved on another day, and roll over to the new day if the app was left open overnight.
    (function () {
      var standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      if (!standalone) return;
      // iOS reopens the app on whatever URL it last showed (or the URL the icon was
      // saved with), so we track when the app was last on screen: after a break of
      // more than AWAY_MS, or on a new calendar day, a day page jumps to today.
      var AWAY_MS = 10 * 60 * 1000, KEY = "planner:lastSeen";
      var b = document.body, todayUrl = b.dataset.todayUrl;
      var m = location.pathname.match(/\/(\d{4}-\d{2}-\d{2})\/$/);
      var shownDay = m ? m[1] : null;
      function localDate() {
        // Same clock as the server (Africa/Johannesburg); en-CA formats as YYYY-MM-DD.
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Johannesburg" }).format(new Date());
      }
      function lastSeen() {
        try { return parseInt(localStorage.getItem(KEY) || "0", 10); } catch (e) { return 0; }
      }
      function markSeen() {
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      }
      function check() {
        var away = Date.now() - lastSeen() > AWAY_MS;
        var stale = b.dataset.viewingToday && b.dataset.viewingToday !== localDate();
        if (shownDay && shownDay !== localDate() && (away || stale)) {
          location.replace(todayUrl);
          return true;
        }
        markSeen();
        return false;
      }
      if (check()) return;
      window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") check(); else markSeen();
      });
      window.addEventListener("pagehide", markSeen);
    })();

    // Keep your scroll position across form submits (every action is a normal POST).
    (function () {
      var key = "scroll:" + location.pathname;
      try {
        var y = sessionStorage.getItem(key);
        if (y !== null) {
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
          window.scrollTo(0, parseInt(y, 10));
          requestAnimationFrame(function () { window.scrollTo(0, parseInt(y, 10)); });
        }
        sessionStorage.removeItem(key);
      } catch (e) {}
      document.addEventListener("submit", function (e) {
        if (e.target.dataset.keepScroll === undefined) return;
        try { sessionStorage.setItem(key, String(window.scrollY)); } catch (err) {}
      }, true);
      setTimeout(function () {
        document.querySelectorAll(".toast").forEach(function (t) { t.classList.add("hide"); });
      }, 4000);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
